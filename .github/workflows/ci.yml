name: CI

on:
  push:
    branches: [main, experiment-lens]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build, check formatting and run tests
        run: ./mvnw -B verify
